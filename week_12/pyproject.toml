[project]
name = "zero-sim"
version = "0.1.0"
description = "ZeRO-1/2/3 sharding simulated across 32 CPU-process 'virtual GPUs' with torch.distributed"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
]
